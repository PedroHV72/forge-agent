name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  operational-offline:
    name: Offline ${{ matrix.host }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: claude
            os: ubuntu-latest
            platform: linux
            shell: bash
          - host: codex
            os: ubuntu-latest
            platform: linux
            shell: bash
          - host: claude
            os: macos-latest
            platform: darwin
            shell: bash
          - host: codex
            os: macos-latest
            platform: darwin
            shell: bash
          - host: claude
            os: windows-latest
            platform: win32
            shell: pwsh
          - host: codex
            os: windows-latest
            platform: win32
            shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic offline operational gate
        shell: ${{ matrix.shell }}
        run: node scripts/forge-offline-ci.js --host ${{ matrix.host }} --platform ${{ matrix.platform }}

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Subversion (smoke fixture gate)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Run test suites
        run: node scripts/run-tests.js

      - name: Smoke suite (release gate)
        if: runner.os != 'Windows'
        run: node scripts/forge-smoke.js
