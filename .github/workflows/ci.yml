name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the smoke's S07 scope gate resolves its base as the parent
          # of the commit that added scripts/forge-touch.js, and that gate FAILS
          # rather than skipping when the base does not resolve (by design). Under
          # the default depth-1 checkout every file looks added by the single commit
          # present and `<sha>^` does not exist, so the gate could never pass on CI.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Subversion (smoke fixture gate)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Run test suites
        run: node scripts/run-tests.js

      - name: Smoke suite (release gate)
        if: runner.os != 'Windows'
        run: node scripts/forge-smoke.js
